services:
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    container_name: komodo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    labels:
      komodo.skip: "true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KOMODO_DATABASE_USERNAME} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    container_name: komodo-ferretdb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres
    volumes:
      - ferretdb-state:/state
    networks:
      - database
    labels:
      komodo.skip: "true"

  core:
    image: ghcr.io/moghtech/komodo-core:2
    container_name: komodo-core
    init: true
    restart: unless-stopped
    depends_on:
      - ferretdb
    env_file:
      - .env
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
    volumes:
      - komodo-keys:/config/keys
      - ${KOMODO_BACKUPS_PATH}:/backups
    networks:
      - proxy
      - database
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.komodo.rule=Host(`${KOMODO_DOMAIN}`)
      - traefik.http.routers.komodo.entrypoints=websecure
      - traefik.http.routers.komodo.tls=true
      - traefik.http.routers.komodo.tls.certresolver=letsencrypt
      - traefik.http.services.komodo.loadbalancer.server.port=9120

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    container_name: komodo-periphery
    init: true
    restart: unless-stopped
    depends_on:
      - core
    env_file:
      - .env
    volumes:
      - komodo-keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - ${PERIPHERY_ROOT_DIRECTORY}:${PERIPHERY_ROOT_DIRECTORY}
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true
  database:
    name: komodo-database
    internal: true

volumes:
  traefik-certs:
  postgres-data:
  ferretdb-state:
  komodo-keys:
