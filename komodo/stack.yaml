services:
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KOMODO_DATABASE_USERNAME} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
      labels:
        komodo.skip: "true"

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres
    volumes:
      - ferretdb-state:/state
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
      labels:
        komodo.skip: "true"

  # Named komodo-core (not core) so the name cannot collide with other stacks on the shared proxy network.
  komodo-core:
    image: ghcr.io/moghtech/komodo-core:2
    init: true
    environment:
      TZ: ${TZ:-UTC}
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      KOMODO_HOST: ${KOMODO_HOST}
      KOMODO_TITLE: ${KOMODO_TITLE:-Komodo}
      KOMODO_LOCAL_AUTH: ${KOMODO_LOCAL_AUTH:-true}
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD}
      KOMODO_PERIPHERY_PUBLIC_KEY: ${KOMODO_PERIPHERY_PUBLIC_KEY}
      KOMODO_FIRST_SERVER_NAME: ${KOMODO_FIRST_SERVER_NAME:-Local}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_JWT_TTL: ${KOMODO_JWT_TTL:-1-day}
      KOMODO_DISABLE_USER_REGISTRATION: ${KOMODO_DISABLE_USER_REGISTRATION:-true}
      KOMODO_DISABLE_CONFIRM_DIALOG: ${KOMODO_DISABLE_CONFIRM_DIALOG:-false}
    volumes:
      - komodo-keys:/config/keys
      - type: bind
        source: ${KOMODO_BACKUPS_PATH}
        target: /backups
    networks:
      - proxy
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      # keys volume is node-local and shared with periphery
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.komodo.rule=Host(`${KOMODO_DOMAIN}`)"
        - "traefik.http.routers.komodo.entrypoints=websecure"
        - "traefik.http.routers.komodo.tls=true"
        - "traefik.http.routers.komodo.tls.certresolver=letsencrypt"
        - "traefik.http.services.komodo.loadbalancer.server.port=9120"

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    init: true
    environment:
      TZ: ${TZ:-UTC}
      PERIPHERY_CORE_ADDRESS: ${PERIPHERY_CORE_ADDRESS:-ws://komodo-core:9120}
      PERIPHERY_CONNECT_AS: ${PERIPHERY_CONNECT_AS:-Local}
      PERIPHERY_CORE_PUBLIC_KEYS: ${PERIPHERY_CORE_PUBLIC_KEYS:-file:/config/keys/core.pub}
      PERIPHERY_ROOT_DIRECTORY: ${PERIPHERY_ROOT_DIRECTORY}
      PERIPHERY_DISABLE_TERMINALS: ${PERIPHERY_DISABLE_TERMINALS:-false}
      PERIPHERY_DISABLE_CONTAINER_TERMINALS: ${PERIPHERY_DISABLE_CONTAINER_TERMINALS:-false}
    volumes:
      - komodo-keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - type: bind
        source: ${PERIPHERY_ROOT_DIRECTORY}
        target: ${PERIPHERY_ROOT_DIRECTORY}
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

networks:
  proxy:
    name: proxy
    external: true
  internal:
    name: komodo-internal
    driver: overlay
    internal: true

volumes:
  postgres-data:
  ferretdb-state:
  komodo-keys:
